<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMPAY - طلب القرض</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --ompay-primary: #004b87;
            --ompay-hover: #003366;
            --ompay-blue-light: #0077b6;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-border: #cbd5e1;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        .app-header {
            width: 100%; background-color: var(--ompay-primary); height: 60px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
            border-bottom: 3px solid var(--ompay-blue-light);
        }
        .back-btn { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 20px; font-weight: 800; color: white; }
        .header-title .om { color: #90e0ef; margin-left: 4px; }
        .header-title .pay { color: #ffffff; }

        .card {
            background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px;
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 75, 135, 0.08); display: flex; flex-direction: column;
            border-top: 5px solid var(--ompay-blue-light);
        }
        .main-title { font-size: 24px; color: var(--text-main); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }

        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--ompay-primary); }

        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        .form-group label { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }
        .form-control {
            font-size: 15px; padding: 14px 16px; border: 1px solid var(--input-border); border-radius: 10px;
            background-color: #ffffff; color: #334155; outline: none; width: 100%; text-align: right;
        }
        .form-control:focus { border-color: var(--ompay-primary); }
        textarea.form-control { resize: none; height: 95px; }

        .btn-next {
            background-color: var(--ompay-primary); color: white; border: none; width: 100%; padding: 16px;
            border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 15px; transition: background-color 0.2s;
        }
        .btn-next:hover { background-color: var(--ompay-hover); }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #64748b; margin-top: auto; }
    </style>
</head>
<body>

<div class="app-header">
    <a href="/" class="back-btn">→ رجوع</a>
    <div class="header-title">
        <span class="pay">OM</span><span class="om">PAY</span>
    </div>
    <div style="width: 24px;"></div>
</div>

<div class="card">
    <h1 class="main-title">طلب القرض</h1>
    <div class="subtext">الخطوة 1 من 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">نوع القرض</label>
            <select id="loanType" class="form-control" required>
                <option value="قرض شخصي" selected>قرض شخصي</option>
                <option value="قرض تجاري">قرض تجاري</option>
                <option value="قرض تعليمي">قرض تعليمي</option>
                <option value="قرض طارئ">قرض طارئ</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">مبلغ القرض (ر.ع.)</label>
            <input type="number" id="loanAmt" class="form-control" placeholder="2500" value="2500" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">مدة القرض</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 أشهر">6 أشهر</option>
                <option value="12 شهر" selected>12 شهر</option>
                <option value="18 شهر">18 شهر</option>
                <option value="24 شهر">24 شهر</option>
                <option value="36 شهر">36 شهر</option>
                <option value="48 شهر">48 شهر</option>
                <option value="60 شهر">60 شهر</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">الغرض من القرض</label>
            <textarea id="loanPurpose" class="form-control" placeholder="ما هو الغرض من استخدام هذا القرض؟" required></textarea>
        </div>

        <button type="submit" class="btn-next">الخطوة التالية</button>
    </form>
</div>

<div class="footer-banner">© 2026 OMPAY سلطنة عمان</div>

<script>
    window.onload = () => {
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        const savedAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount');
        if (savedAmount) document.getElementById('loanAmt').value = savedAmount.replace(/\D/g, '');
    };

    function submitStep1(event) {
        event.preventDefault();
        const loanType = document.getElementById('loanType').value;
        const loanAmt = Number(document.getElementById('loanAmt').value) || 0;
        const loanTermVal = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value;
        const months = Number(loanTermVal.replace(/\D/g, '')) || 12;

        const annualRate = 0.05;
        const totalInterest = loanAmt * annualRate * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('amount', loanAmt);
        localStorage.setItem('loan_term', months);
        localStorage.setItem('duration', months);
        localStorage.setItem('appliedTerm', loanTermVal);
        localStorage.setItem('monthly_repayment', monthlyPayment);
        localStorage.setItem('appliedLoanType', loanType);
        localStorage.setItem('appliedPurpose', loanPurpose);

        window.location.href = "/page3";
    }
</script>
</body>
</html>
